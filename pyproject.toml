[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bedrock-rag"
version = "0.1.0"
description = "Retrieval-Augmented Generation on AWS Lambda using Amazon Bedrock and S3."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Converse API requires a reasonably recent boto3.
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
